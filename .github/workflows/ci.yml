name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Resolve locked SwiftPM dependencies
        run: ./scripts/swift.sh package resolve --only-use-versions-from-resolved-file

      - name: Static and compile checks
        run: make check

      - name: Run tests
        run: make test

      - name: Package and verify local release artifacts
        run: make package

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Clipboard-ci-packages
          path: dist/packages/
          retention-days: 14
